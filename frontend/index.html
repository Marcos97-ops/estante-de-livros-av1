<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estante de Livros</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-amber-50 min-h-screen">

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo">
        <span class="logo-icon">📚</span>
        <div>
          <h1 class="logo-title">Estante de Livros</h1>
          <p class="logo-sub">Sua biblioteca pessoal</p>
        </div>
      </div>
      <div id="stats-bar" class="stats-bar">
        <span class="stat-item"><span id="count-lido" class="stat-num">0</span> lidos</span>
        <span class="stat-sep">·</span>
        <span class="stat-item"><span id="count-lendo" class="stat-num">0</span> lendo</span>
        <span class="stat-sep">·</span>
        <span class="stat-item"><span id="count-quero" class="stat-num">0</span> quero ler</span>
      </div>
      <div class="user-bar">
        <span id="saudacao-usuario" class="user-greeting"></span>
        <button id="btn-sair" type="button" class="btn-logout">Sair</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="site-main">

    <!-- FORMULÁRIO DE ADIÇÃO -->
    <section class="form-section" aria-label="Adicionar novo livro">
      <h2 class="section-title">Adicionar Livro</h2>
      <div class="form-card">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label for="input-titulo" class="field-label">Título <span class="text-red-400">*</span></label>
            <input id="input-titulo" type="text" placeholder="Ex: Dom Casmurro" class="field-input" />
          </div>
          <div>
            <label for="input-autor" class="field-label">Autor <span class="text-red-400">*</span></label>
            <input id="input-autor" type="text" placeholder="Ex: Machado de Assis" class="field-input" />
          </div>
          <div>
            <label for="input-status" class="field-label">Status</label>
            <select id="input-status" class="field-input">
              <option value="quero-ler">📖 Quero ler</option>
              <option value="lendo">🔖 Lendo</option>
              <option value="lido">✅ Lido</option>
            </select>
          </div>
          <div>
            <label for="input-categoria" class="field-label">Categoria</label>
            <select id="input-categoria" class="field-input">
              <option value="">Sem categoria</option>
            </select>
          </div>
        </div>

        <!-- Alerta estilizado com utilitários do Tailwind -->
        <div id="error-msg" class="hidden rounded-lg border border-red-300 bg-red-50 px-4 py-2.5 text-sm text-red-700" role="alert">
          ⚠️ Preencha o título e o autor antes de adicionar.
        </div>

        <div class="form-actions">
          <!-- Botão estilizado com utilitários do Tailwind -->
          <button id="btn-adicionar" type="button"
            class="w-full sm:w-auto inline-flex items-center justify-center bg-[#c8832a] hover:bg-[#a8681e] active:scale-95 text-white font-semibold text-sm px-6 py-2.5 rounded-lg transition">
            + Adicionar à estante
          </button>
        </div>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="filter-section" aria-label="Filtrar livros">
      <div class="filter-group" role="group" aria-label="Filtros de status">
        <button class="filter-btn active" data-filter="todos">Todos</button>
        <button class="filter-btn" data-filter="quero-ler">📖 Quero ler</button>
        <button class="filter-btn" data-filter="lendo">🔖 Lendo</button>
        <button class="filter-btn" data-filter="lido">✅ Lidos</button>
      </div>
      <div class="filter-categoria-wrap">
        <label for="filter-categoria" class="sr-only">Filtrar por categoria</label>
        <select id="filter-categoria" class="field-input">
          <option value="todas">Todas as categorias</option>
        </select>
      </div>
    </section>

    <!-- LISTA DE LIVROS -->
    <section class="books-section" aria-label="Lista de livros">
      <div id="empty-state" class="empty-state">
        <span class="empty-icon">🕮</span>
        <p class="empty-title">Sua estante está vazia</p>
        <p class="empty-sub">Adicione seu primeiro livro acima!</p>
      </div>

      <!-- Grid Tailwind -->
      <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 hidden">
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>Estante de Livros &mdash; Projeto Final Full-Stack &copy; 2026</p>
  </footer>

  <!-- Template do card (oculto) -->
  <template id="card-template">
    <article class="book-card">
      <div class="card-status-badge"></div>
      <div class="card-body">
        <h3 class="card-title"></h3>
        <p class="card-author"></p>
        <p class="card-categoria"></p>
      </div>
      <div class="card-footer">
        <select class="card-status-select field-input text-sm py-1"></select>
        <button class="btn-remove" aria-label="Remover livro">🗑</button>
      </div>
    </article>
  </template>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
